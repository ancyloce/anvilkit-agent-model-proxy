{{- include "anvilkit-agent-model-proxy.require" . -}}
{{- if eq .Values.secrets.provider "csi" }}
{{- $c := .Values.secrets.csi }}
{{- $keys := list "store-access-key-id" "store-secret-access-key" }}
{{- range $c.providerCredentials }}{{ $keys = append $keys (required "secrets.csi.providerCredentials[].key is required" .key) }}{{ end }}
# P0.6: the service's credentials from OpenBao (no Kubernetes Secret): one
# file per key of the service's KV v2 path, world-readable inside the Pod's
# own volume (the container runs as a non-root user).
apiVersion: secrets-store.csi.x-k8s.io/v1
kind: SecretProviderClass
metadata:
  name: {{ include "anvilkit-agent-model-proxy.fullname" . }}
  labels:
    {{- include "anvilkit-agent-model-proxy.labels" . | nindent 4 }}
spec:
  provider: openbao
  parameters:
    baoAddress: {{ $c.address | quote }}
    {{- with $c.caCertPath }}
    baoCACertPath: {{ . | quote }}
    {{- end }}
    roleName: {{ default (include "anvilkit-agent-model-proxy.serviceAccountName" .) $c.role | quote }}
    audience: {{ $c.audience | quote }}
    objects: |
      {{- range $keys }}
      - objectName: {{ . | quote }}
        secretPath: {{ $c.path | quote }}
        secretKey: {{ . | quote }}
        filePermission: 0444
      {{- end }}
{{- end }}
